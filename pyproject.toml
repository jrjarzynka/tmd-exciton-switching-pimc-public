[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmd_pimc"
version = "1.0.0"
description = "Finite-temperature PI-QMC for moire-confined exciton centre-of-mass dynamics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "J. R. Jarzynka" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/jrjarzynka/tmd-exciton-switching-pimc-public"

[tool.setuptools]
package-dir = { "" = "numerics" }

[tool.setuptools.packages.find]
where = ["numerics"]
